name: release-please

# Automatic releases. Never hand-tag. The release PR is pushed with a token
# minted from the zeroday-sdk-fanout GitHub App, not GITHUB_TOKEN: a PR
# pushed by GITHUB_TOKEN never runs its own CI (its runs sit at
# action_required), and its tag push fires no workflow (adk#206 family).
# The org release-pipeline-health audit flags exactly that (AGENTS.md §9b).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: intake-agent

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
