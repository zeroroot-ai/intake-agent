name: image
# Build and cosign-sign the intake-agent image from source, with the org
# reusable image-build workflow. The catalog manifest in gibson names the
# agent by the digest that this workflow produces. The manifest stays in gibson.
#
# Trigger discipline: push:main (sha-tagged) + the release tag
# (release-please cuts `v*`; tag_pattern derives the semver image tag from it)
# + workflow_dispatch for a manual rebuild. Never on a pull request.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@78606607ff7c6192237bb05b4610af6bbe16e8ee # v0.22.0
    with:
      component_name: intake-agent
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/intake-agent
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      tag_pattern: type=match,pattern=v(.*)
      # VERSION is stamped into the binary, which reports it at registration.
      # Passing github.ref_name means a tagged build reports its release and a
      # main build reports the branch. Omitting it entirely would leave the
      # Dockerfile's `dev` default on every published image, which is
      # indistinguishable from a local build in the console and the registry.
      build_args: |
        VERSION=${{ github.ref_name }}
